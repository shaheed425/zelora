<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CE9F" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E8055" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22201D" />
      <stop offset="100%" stop-color="#121110" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#darkBg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.4" />
  
  <!-- Outer Octagonal Luxury Frame Line -->
  <polygon points="256,56 424,120 456,256 424,392 256,456 88,392 56,256 88,120" fill="none" stroke="url(#goldGradient)" stroke-width="6" opacity="0.8" />
  
  <!-- Inner Diamond Accent -->
  <polygon points="256,88 392,256 256,424 120,256" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />

  <!-- Architectural Luxury Monogram 'Z' -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Teak Bar -->
    <path d="M 160 170 L 352 170 C 362 170 368 178 362 186 L 202 332 L 352 332 C 362 332 368 340 368 350 C 368 360 360 368 350 368 L 160 368 C 150 368 144 360 150 352 L 310 206 L 160 206 C 150 206 144 198 144 188 C 144 178 152 170 160 170 Z" fill="url(#goldGradient)" />
    
    <!-- Central Luxury Crown Star / Diamond Motif -->
    <circle cx="256" cy="140" r="10" fill="url(#goldGradient)" />
    <circle cx="256" cy="372" r="10" fill="url(#goldGradient)" />
  </g>
</svg>
